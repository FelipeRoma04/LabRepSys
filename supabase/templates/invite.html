<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activa tu cuenta de LabRepSys</title>
  </head>
  <body style="margin:0;background:#f3f6f8;color:#17212b;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #d8e1e8;border-radius:12px">
          <tr><td style="padding:32px">
            <p style="margin:0 0 8px;color:#146c65;font-size:14px;font-weight:700">LabRepSys</p>
            <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3">Activa tu cuenta</h1>
            <p style="font-size:16px;line-height:1.6">El administrador del laboratorio te invitó a LabRepSys. Confirma tu acceso y crea una contraseña personal:</p>
            <p style="margin:28px 0">
              <a href="{{ .SiteURL }}/#/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite" style="display:inline-block;padding:13px 20px;border-radius:8px;background:#146c65;color:#fff;font-weight:700;text-decoration:none">Crear mi contraseña</a>
            </p>
            <p style="font-size:14px;line-height:1.6">Si no esperabas esta invitación, puedes ignorar este mensaje.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
