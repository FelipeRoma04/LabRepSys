name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  # ── 1. Lint, typecheck, test y build ──────────────────────────────────────
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Compilar producción
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      # ── Verificar que service_role no está en el bundle ───────────────────
      - name: Verificar ausencia de service_role en el bundle
        run: |
          if grep -r "service_role" dist/ 2>/dev/null; then
            echo "ERROR: La cadena 'service_role' aparece en el bundle de producción."
            echo "Una clave privilegiada nunca debe llegar al frontend."
            exit 1
          fi
          echo "OK: service_role no encontrado en dist/"

      # ── Auditoría de seguridad de dependencias npm ────────────────────────
      - name: Auditoría npm (falla en alta o crítica)
        run: npm audit --audit-level=high

  # ── 2. Detección de secretos con Gitleaks ─────────────────────────────────
  secrets-scan:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Gitleaks necesita el historial completo

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # ── 3. Validar migraciones de Supabase ────────────────────────────────────
  validate-migrations:
    name: Validar migraciones SQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labtest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get install -y postgresql-client

      - name: Aplicar extensiones mínimas (stub de auth)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/labtest -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE SCHEMA IF NOT EXISTS extensions;
            CREATE SCHEMA IF NOT EXISTS storage;

            -- Roles que Supabase trae de fábrica. Sin ellos, los bloques que
            -- hacen GRANT/REVOKE o CREATE POLICY ... TO authenticated fallan
            -- completos y dejan tablas sin RLS.
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            END
            \$\$;

            -- Stub mínimo de auth.users para las migraciones
            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              email text,
              raw_user_meta_data jsonb
            );

            -- Stub mínimo de auth.uid()
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;

            -- Stub mínimo de storage.buckets / storage.objects
            CREATE TABLE IF NOT EXISTS storage.buckets (
              id text PRIMARY KEY,
              name text,
              public boolean
            );
            CREATE TABLE IF NOT EXISTS storage.objects (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              bucket_id text,
              name text
            );
          "

      - name: Aplicar migraciones en orden
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Aplicando: $f"
            psql postgresql://postgres:postgres@localhost:5432/labtest -f "$f"
          done

      - name: Verificar que todas las tablas public tienen RLS activo
        run: |
          TABLAS_SIN_RLS=$(psql postgresql://postgres:postgres@localhost:5432/labtest -t -A -c "
            SELECT c.relname
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind = 'r'
              AND NOT c.relrowsecurity;
          ")
          if [ -n "$TABLAS_SIN_RLS" ]; then
            echo "ERROR: Las siguientes tablas no tienen RLS activo:"
            echo "$TABLAS_SIN_RLS"
            exit 1
          fi
          echo "OK: Todas las tablas public tienen RLS activo."

  lint-supabase-db:
    name: Lint opcional de Supabase (base local)
    if: ${{ vars.RUN_SUPABASE_DB_LINT == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Iniciar Supabase local (requiere Docker)
        run: npx --yes supabase start

      - name: Analizar SQL de la base local
        run: npx --yes supabase db lint --fail-on error
